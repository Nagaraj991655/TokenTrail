services:

  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - tokentrail_data:/app/data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  tokentrail_data:
